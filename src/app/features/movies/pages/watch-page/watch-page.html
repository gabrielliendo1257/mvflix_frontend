<div class="watch-page">
    <header class="watch-header">
        <button class="header-btn back-btn" (click)="goBack()" [attr.aria-label]="'Back'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>

        <a class="brand" [routerLink]="['/movies']">
            <span class="brand-mark">M</span>
            <span class="brand-name">MVFLIX</span>
        </a>

        <div class="header-actions">
            <button class="header-btn" [attr.aria-label]="'Settings'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <button class="header-btn avatar" [attr.aria-label]="'Profile'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="watch-main">
        @if (loading()) {
            <div class="player-shell player-loading" aria-label="Cargando"></div>
        } @else if (error(); as playbackError) {
            <div class="playback-error">
                <p class="playback-error-message">{{ playbackError }}</p>
                <button class="btn-back-inline" type="button" (click)="goBack()">Volver al catálogo</button>
            </div>
        } @else {
            <div class="player-shell">
                <app-video-player
                    [src]="videoSrc()"
                    [poster]="poster()"
                    [startTime]="resumeSeconds() ?? 0"
                    (snapshot)="watchStore.onSnapshot($event)"
                    (paused)="watchStore.onPaused()"
                    (playbackError)="watchStore.onPlaybackError()"
                ></app-video-player>
            </div>

            <section class="movie-info">
                <div class="movie-info-left">
                    @if (poster()) {
                        <img class="info-poster" [src]="poster()" [alt]="title()"/>
                    }
                </div>
                <div class="movie-info-main">
                    <h1 class="movie-title">{{ title() }}</h1>
                    @if (year()) {
                        <div class="movie-meta">{{ year() }}</div>
                    }
                    @if (overview()) {
                        <p class="movie-overview">{{ overview() }}</p>
                    }
                </div>
            </section>
        }
    </main>
</div>
